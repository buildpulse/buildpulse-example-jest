name: CI

on:
  push:
  pull_request:

jobs:
  # Pushes run on BuildPulse runners and upload results to BuildPulse.
  test:
    if: github.event_name == 'push'
    runs-on: bp-ubuntu-latest-x64-2x
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: npx jest --reporters=default --reporters=jest-junit
        env:
          JEST_JUNIT_OUTPUT_DIR: test-results
      - name: Upload test results to BuildPulse
        # BuildPulse is most useful when tests FAILED, so run on red builds too.
        if: always()
        uses: BuildPulseLLC/test-reporter-action@v3
        with:
          api-token: ${{ secrets.BUILDPULSE_API_TOKEN }}
          path: test-results

  # Pull requests (including forks, which have no secrets) build on GitHub-hosted.
  test-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: npm test
